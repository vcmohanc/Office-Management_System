server {
    listen 80;
    server_name oms.vegecoop.net;

    # Required for Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name oms.vegecoop.net;

    # SSL Certificates (These will be generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/oms.vegecoop.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oms.vegecoop.net/privkey.pem;

    client_max_body_size 25M;

    charset utf-8;
    charset_types text/css text/plain text/xml application/json application/javascript application/xml;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }
}
