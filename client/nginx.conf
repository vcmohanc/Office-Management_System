server {
    listen 80;
    server_name oms.vegecoop.net 13.159.83.241;

    # Required for Let's Encrypt validation
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Deny all dotfiles except the ACME challenge path handled above.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name oms.vegecoop.net 13.159.83.241;

    # SSL Certificates (These will be generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/oms.vegecoop.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oms.vegecoop.net/privkey.pem;

    client_max_body_size 25M;

    charset utf-8;
    charset_types text/css text/plain text/xml application/json application/javascript application/xml;

    # Block rogue / aggressive crawlers & AI bots
    if ($http_user_agent ~* (Bytespider|CCBot|ChatGPT-User|GPTBot|ClaudeBot|anthropic-ai|Google-Extended|PetalBot|SemrushBot|AhrefsBot|DotBot|MJ12bot)) {
        return 403;
    }

    # Re-resolve Docker service IPs dynamically to prevent 504 timeouts after server container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SSE endpoint - disable buffering and allow long-lived connections
    location = /api/events {
        set $upstream_server http://server:5000;
        proxy_pass $upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # Proxy API requests to backend - strictly protected from indexing
    location /api/ {
        set $upstream_server http://server:5000;
        proxy_pass $upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # Allow Certbot challenge if requested via HTTPS
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Deny all dotfiles except the ACME challenge path handled above.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    root /usr/share/nginx/html;

    # Dedicated robots.txt handler
    location = /robots.txt {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    # Prevent browser caching of index.html so updates are visible immediately
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve static assets with hash cache
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
