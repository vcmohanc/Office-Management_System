server {
    listen 80;
    server_name oms.vegecoop.net localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name oms.vegecoop.net localhost;

    ssl_certificate /etc/letsencrypt/live/oms.vegecoop.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oms.vegecoop.net/privkey.pem;

    # Allow up to 25 MB request body (server allows 10 files × 2 MB each)
    client_max_body_size 25M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html to ensure clients always get the latest bundle
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Increase timeouts for file upload requests
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}
