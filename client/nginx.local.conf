server {
    listen 80;
    server_name localhost 127.0.0.1;

    client_max_body_size 25M;

    charset utf-8;
    charset_types text/css text/plain text/xml application/json application/javascript application/xml;

    # Re-resolve Docker service IPs dynamically to prevent 504 timeouts after server container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SSE endpoint - disable buffering and allow long-lived connections
    location = /api/events {
        set $upstream_server http://server:5000;
        proxy_pass $upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
    }

    # Proxy API requests to backend
    location /api/ {
        set $upstream_server http://server:5000;
        proxy_pass $upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }
}
