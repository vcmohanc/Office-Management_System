services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    image: mohanc35/oms-client
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mohanc35/oms-server
    ports:
      - "5050:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-supersecret}@mongo:27017/${MONGO_DB_NAME:-office_manage_system}?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0.5
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-supersecret}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-office_manage_system}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin localhost:27017/test --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mongo_data:
  mongo_config:
  uploads_data:
