services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    image: mohanc35/oms-client
    ports:
      - "3000:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mohanc35/oms-server
    ports:
      - "5050:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-supersecret}@mongo:27017/${MONGO_DB_NAME:-office_manage_system}?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0.5
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-supersecret}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-office_manage_system}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    # Port is only exposed to localhost for security
    # ports:
    #   - "127.0.0.1:27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

volumes:
  mongo_data:
  mongo_config:
  uploads_data:
