name: CI/CD — Build & Deploy OMS VegeCoop

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Log in to Docker Hub ──────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 3. Set up Docker Buildx ──────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Build & push CLIENT image ─────────────────────────────────────
      - name: Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: mohanc35/oms-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Build & push SERVER image ─────────────────────────────────────
      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: mohanc35/oms-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6 & 7. Copy deployment files & Deploy to Live Server via OpenSSH ───
      - name: Copy deployment files & Deploy to Live Server
        timeout-minutes: 15
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          SSH_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes"

          echo "Creating target directories on server..."
          ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" "mkdir -p /home/ubuntu/oms/client"

          echo "Copying deployment files..."
          scp $SSH_OPTS docker-compose.yml deploy.sh "$SERVER_USER@$SERVER_HOST:/home/ubuntu/oms/"
          scp $SSH_OPTS client/nginx.conf "$SERVER_USER@$SERVER_HOST:/home/ubuntu/oms/client/"

          echo "Running deploy.sh on server..."
          ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" "cd /home/ubuntu/oms && chmod +x deploy.sh && ./deploy.sh"
