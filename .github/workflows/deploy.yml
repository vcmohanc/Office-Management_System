name: CI/CD — Build & Deploy OMS VegeCoop

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Log in to Docker Hub ──────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 3. Set up Docker Buildx ──────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Build & push CLIENT image ─────────────────────────────────────
      - name: Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: mohanc35/oms-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Build & push SERVER image ─────────────────────────────────────
      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: mohanc35/oms-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. Copy deployment files to Server ────────────────────────────────
      - name: Copy deployment files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,deploy.sh,client/nginx.conf"
          target: "/home/ubuntu/oms-temp"

      # ── 7. Deploy to Live Server via SSH ─────────────────────────────────
      - name: Deploy to Live Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/oms-temp
            chmod +x deploy.sh
            ./deploy.sh
