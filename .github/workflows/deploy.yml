name: CI/CD — Build & Deploy OMS VegeCoop

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Build Docker images on GitHub and push to registry ──────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            mohanc35/oms-client:latest
            mohanc35/oms-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            mohanc35/oms-server:latest
            mohanc35/oms-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Pull pre-built images and deploy to production server ────────────
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Live Server
        timeout-minutes: 12
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          SSH_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o BatchMode=yes"

          echo "Copying deployment files to server and running deploy.sh..."
          tar -czf - docker-compose.yml deploy.sh client/nginx.conf | \
            ssh $SSH_OPTS -T "$SERVER_USER@$SERVER_HOST" \
              "mkdir -p /home/ubuntu/oms/client && tar -xzf - -C /home/ubuntu/oms && cd /home/ubuntu/oms && chmod +x deploy.sh && ./deploy.sh"
