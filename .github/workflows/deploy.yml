name: CI/CD — Build & Deploy OMS VegeCoop

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Log in to Docker Hub ──────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 3. Set up Docker Buildx ──────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Build & push CLIENT image ─────────────────────────────────────
      - name: Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: mohanc35/oms-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Build & push SERVER image ─────────────────────────────────────
      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: mohanc35/oms-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. Deploy to EC2 via SSH ──────────────────────────────────────────
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # Pull latest images
            sudo docker-compose -f ~/docker-compose.yml pull

            # Restart containers
            sudo docker-compose -f ~/docker-compose.yml up -d --remove-orphans

            # Wait for server to be ready
            sleep 8

            # Seed options data if collection is empty
            sudo docker-compose -f ~/docker-compose.yml exec -T server node seedOptions.js || true

            # Remove old/dangling images to save disk space
            sudo docker image prune -f

            echo "✅ Deployment complete!"
